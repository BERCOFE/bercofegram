<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fafafa;--card:#fff;--ink:#14161f;--mute:#6b7080;--line:#e3e5ec;--accent:#0095f6;--heart:#ff3d5a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1117;--card:#181b24;--ink:#eef0f6;--mute:#8d93a5;--line:#272b38;--accent:#7b8dff;--heart:#ff5c78}}
:root[data-theme="dark"]{--bg:#0f1117;--card:#181b24;--ink:#eef0f6;--mute:#8d93a5;--line:#272b38;--accent:#7b8dff;--heart:#ff5c78}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Trebuchet MS","Segoe UI",system-ui,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{max-width:480px;margin:0 auto;padding-bottom:84px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.logo{font:700 28px "Snell Roundhand","Brush Script MT","Segoe Script",cursive;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);-webkit-background-clip:text;background-clip:text;color:transparent}
header button{color:var(--ink);position:relative}
.ni{width:40px;height:40px;border-radius:12px;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);display:grid;place-items:center;color:#fff;font-weight:800;flex:none}
.dot{position:absolute;top:-4px;right:-6px;background:var(--heart);color:#fff;font:700 10px/16px sans-serif;border-radius:8px;min-width:16px;text-align:center;padding:0 4px;font-style:normal}
.nrow{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
#nb{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);width:min(440px,calc(100% - 20px));background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 12px 40px #0006;z-index:30;cursor:pointer;animation:ndrop .5s cubic-bezier(.2,.9,.3,1.2)}
@keyframes ndrop{from{transform:translate(-50%,-140%);opacity:0}}
@media (prefers-reduced-motion:reduce){#nb{animation:none}}
.scene{perspective:600px;display:inline-block;zoom:var(--s,1);width:96px;height:96px}
.cube{width:96px;height:96px;position:relative;transform-style:preserve-3d;animation:sway 6s ease-in-out infinite}
.face,.face svg{position:absolute;inset:0;width:100%;height:100%;border-radius:28px}
.face{background:#7a2260}
@keyframes sway{0%,100%{transform:rotateY(-28deg) rotateX(12deg)}50%{transform:rotateY(28deg) rotateX(-8deg)}}
@media (prefers-reduced-motion:reduce){.cube{animation:none;transform:rotateY(-22deg) rotateX(10deg)}}
.auth{padding:24px 16px;position:relative;z-index:1;min-height:calc(100vh - 120px);display:flex;flex-direction:column;justify-content:center}
.auth .box{background:color-mix(in srgb,var(--card) 76%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid #fff3;border-radius:18px}
.authbg{position:fixed;inset:0;overflow:hidden;z-index:0;display:grid;place-items:center;background:radial-gradient(circle at 25% 15%,#4f5bd5 0,transparent 55%),radial-gradient(circle at 85% 85%,#d62976 0,transparent 55%),radial-gradient(circle at 80% 15%,#fa7e1e 0,transparent 40%),#160722}
.bigw{transform:translate(calc(var(--px,0)*1px),calc(var(--py,0)*1px)) rotateY(calc(var(--px,0)*.5deg)) rotateX(calc(var(--py,0)*-.5deg));transition:transform .2s ease-out}
.neon .face{background:none}
.neon .face:last-child{filter:drop-shadow(0 0 5px #ff5fa8) drop-shadow(0 0 18px #d62976)}
.auth .box.out{animation:bout .38s ease-in forwards}
.auth .box.in{animation:bin .55s cubic-bezier(.2,.9,.3,1.2)}
@keyframes bout{to{transform:perspective(900px) rotateY(90deg) scale(.88);opacity:0}}
@keyframes bin{from{transform:perspective(900px) rotateY(-90deg) scale(.88);opacity:0}}
.bigw.dive{animation:dive .6s ease-in-out}
@keyframes dive{50%{scale:1.35;filter:brightness(1.5)}}
@media (prefers-reduced-motion:reduce){.auth .box.out,.auth .box.in,.bigw.dive{animation:none}}
.pw{position:relative}.pw input{padding-right:64px}.pw button{position:absolute;right:12px;top:10px}
.meter{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:6px}
.meter i{display:block;height:100%;width:0;transition:width .25s,background .25s}
.authbg.enter{animation:bgfade .7s ease-in forwards}
@keyframes bgfade{60%{opacity:1}to{opacity:0}}
.authbg.enter .bigw{animation:warp .7s ease-in forwards}
@keyframes warp{to{scale:3.4;opacity:0;filter:brightness(2.2)}}
.auth .box.go{animation:bgo .6s ease-in forwards}
@keyframes bgo{to{transform:scale(1.25);opacity:0}}
#app.arrive{animation:arrive .6s ease-out}
@keyframes arrive{from{opacity:0;transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){.authbg.enter,.authbg.enter .bigw,.auth .box.go,#app.arrive{animation:none}}
.rules{list-style:none;margin:-2px 0 10px;padding:0;font-size:12px;text-align:left;color:var(--mute)}
.rules li:before{content:"○ "}.rules li.ok{color:#2e9e5b}.rules li.ok:before{content:"✓ "}.rules li.bad{color:var(--heart)}.rules li.bad:before{content:"✕ "}
.fl{display:block;text-align:left;font-size:12px;font-weight:700;color:var(--mute);margin:0 0 4px}
#side{display:none}
.sl{display:flex;align-items:center;gap:6px;padding:4px 10px 24px}
.sb{display:flex;align-items:center;gap:16px;padding:12px;border-radius:12px;font-size:16px;position:relative;width:100%;text-align:left}
.sb:hover{background:var(--bg)}.sb.on{font-weight:800}.sb .dot{top:6px;left:28px;right:auto}
@media (min-width:900px){
#side.on{display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:244px;padding:calc(env(safe-area-inset-top,0px) + 20px) 12px 20px;background:var(--card);border-right:1px solid var(--line);z-index:7}
#side.on+#app{margin-left:calc(244px + (100% - 244px - 480px)/2);margin-right:0;padding-bottom:40px}
nav,header{display:none!important}
#toast{bottom:24px}}
.tag{color:var(--accent);cursor:pointer}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:10px}
.chip{flex:none;padding:6px 12px;border-radius:16px;border:1px solid var(--line);font-size:13px}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.reels{height:calc(100vh - 150px);overflow-y:auto;scroll-snap-type:y mandatory}
.reel{height:100%;scroll-snap-align:start;position:relative;color:#fff;overflow:hidden;animation:flow 10s ease infinite}
@keyframes flow{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
.re{position:absolute;inset:0;display:grid;place-items:center;font-size:140px;opacity:.35}
.reel button{color:#fff}.reel .tag{color:#fff;text-decoration:underline}
.ra{position:absolute;right:12px;bottom:90px;display:flex;flex-direction:column;align-items:center;gap:14px;text-shadow:0 1px 4px #0006}
.rb{position:absolute;left:14px;right:70px;bottom:24px;text-shadow:0 1px 4px #0006}.rb p{margin:8px 0 0}
.rf{border:1px solid #fff;border-radius:8px;padding:2px 10px;font-size:13px}
#sug{display:none}
@media (prefers-reduced-motion:reduce){.reel{animation:none}}
@media (min-width:900px){.reels{height:calc(100vh - 40px)}}
@media (min-width:1200px){#sug.on{display:block;position:fixed;top:32px;left:calc(244px + (100vw - 244px - 480px)/2 + 510px);width:300px}}
#cfm{position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:40}
.dlg{background:var(--card);color:var(--ink);border-radius:16px;padding:24px 24px 8px;width:min(320px,calc(100% - 32px));text-align:center}
.dlg h3{margin:0 0 4px;font-size:18px}
.dl{display:block;width:100%;padding:13px;border-top:1px solid var(--line);margin-top:8px}
.dl.red{color:var(--heart);font-weight:800;margin-top:18px}
.corner{position:absolute;top:-44px;right:-12px;z-index:2}
.authbg .scene{filter:drop-shadow(0 30px 40px #0008)}.lnk{color:var(--accent);font-weight:700}
.err{color:var(--heart);font-size:13px;min-height:18px;margin:0 0 6px}
.row{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:8px 0}
.m{max-width:75%;padding:8px 12px;border-radius:18px;background:var(--bg);margin:6px 0;width:fit-content}
.m.me{background:var(--accent);color:#fff;margin-left:auto}
#sv{position:fixed;inset:0;background:#000;color:#fff;z-index:20;padding-top:env(safe-area-inset-top,0px)}
#sv .bars{display:flex;gap:4px;padding:10px 12px 6px;max-width:480px;margin:0 auto}
#sv .bars i{flex:1;height:3px;background:#fff4;border-radius:2px;overflow:hidden}
#sv .bars i.f{background:#fff}#sv .bars i.a:after{content:"";display:block;height:100%;background:#fff;animation:fill 4s linear}
@keyframes fill{from{width:0}to{width:100%}}
#sv .sh{display:flex;align-items:center;gap:10px;max-width:480px;margin:0 auto;padding:6px 12px}
#sv .sh .av{width:32px;height:32px;border:0}#sv .sh b{flex:1}#sv .sh button{color:#fff;font-size:20px}
#sv .img{max-width:480px;margin:0 auto;border-radius:12px}#sv p{max-width:480px;margin:12px auto;padding:0 12px}
.stories{display:flex;gap:14px;overflow-x:auto;padding:14px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.story{flex:none;text-align:center;font-size:12px;width:64px}
.ring{width:62px;height:62px;border-radius:50%;padding:3px;background:conic-gradient(var(--accent),var(--heart),var(--accent));margin-bottom:4px}
.ring.seen{background:var(--line)}
.av{width:100%;height:100%;border-radius:50%;border:2px solid var(--card);display:grid;place-items:center;color:#fff;font-weight:700}
.post{background:var(--card);margin:12px 0;border-block:1px solid var(--line)}
.ph{display:flex;align-items:center;gap:10px;padding:10px 14px}
.ph .av{width:34px;height:34px;flex:none;border:0;font-size:14px}
.ph b{flex:1}
.follow{color:var(--accent);font-weight:700;font-size:13px}
.follow.on{color:var(--mute)}
.img{position:relative;aspect-ratio:1;background-size:cover;background-position:center;user-select:none;display:grid;place-items:center;color:rgba(255,255,255,.85);font:800 28px "Trebuchet MS";text-align:center;padding:24px}
.burst{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-size:90px;color:#fff;opacity:0}
.burst.go{animation:pop .7s ease-out}
@keyframes pop{0%{opacity:0;transform:scale(.4)}30%{opacity:1;transform:scale(1.1)}100%{opacity:0;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.burst.go{animation:none}}
.acts{display:flex;gap:16px;padding:10px 14px 4px;align-items:center}
.acts .sp{flex:1}
.ic{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.liked .ic{fill:var(--heart);stroke:var(--heart)}
.saved .ic{fill:var(--ink)}
.meta{padding:0 14px 12px}
.meta p{margin:2px 0}
.cm{color:var(--mute);font-size:13px}
.cf{display:flex;gap:8px;margin-top:8px}
.cf input{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:20px;padding:7px 12px;font:inherit}
.cf button{color:var(--accent);font-weight:700}
nav{position:fixed;left:0;right:0;bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);background:var(--card);border-top:1px solid var(--line);z-index:6}
nav div{max-width:480px;margin:0 auto;display:flex;justify-content:space-around;padding:10px 0}
nav button{padding:6px 16px;border-radius:12px;color:var(--mute)}
nav button.on{color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.grid .img{font-size:12px;padding:6px;cursor:pointer}
.box{background:var(--card);padding:16px;margin:12px 0;border-block:1px solid var(--line)}
.box h2{margin:0 0 12px;font-size:18px}
textarea,.box input[type=text],.box input[type=password]{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px;font:inherit;margin-bottom:10px}
.drop{display:grid;place-items:center;aspect-ratio:1;border:2px dashed var(--line);border-radius:12px;color:var(--mute);cursor:pointer;margin-bottom:10px;background-size:cover;background-position:center;text-align:center;padding:12px}
.btn{background:var(--accent);color:#fff;border-radius:10px;padding:10px 18px;font-weight:700;width:100%}
.btn:disabled{opacity:.4;cursor:default}
.stats{display:flex;gap:24px;margin:12px 0}
.stats div{text-align:center}.stats b{display:block;font-size:18px}
.empty{padding:40px 24px;text-align:center;color:var(--mute)}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
#toast.on{opacity:1}

:root:not([data-theme="light"]){--bg:#0a0812;--card:#130f1f;--ink:#f3eefc;--mute:#9188ab;--line:#2a2140;--accent:#a855f7;--heart:#ff4d8d}
:root[data-theme="light"]{--bg:#f5f1fc;--card:#fff;--ink:#1b1230;--mute:#6f6788;--line:#e6dff5;--accent:#8b3dff;--heart:#ff3d7f}
body{background:radial-gradient(900px 520px at 15% -10%,#2b1056 0,transparent 60%) fixed,radial-gradient(800px 500px at 100% 0,#3d0f3f 0,transparent 55%) fixed,var(--bg)}
:root[data-theme="light"] body{background:var(--bg)}
#app{padding-left:12px;padding-right:12px}
header{background:color-mix(in srgb,var(--card) 92%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.post,.box,.stories{background:var(--card);border:1px solid var(--line);border-radius:20px;margin:0 0 14px}
.stories{padding:16px;gap:16px}.story{width:76px}.ring{width:72px;height:72px;position:relative;padding:3px}
.ring .plus{position:absolute;right:-2px;bottom:-2px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:17px;border:2px solid var(--card)}
.ph{padding:16px 16px 6px}.ph .av{width:46px;height:46px;border:0;box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--accent)}
.who{flex:1;display:flex;flex-direction:column;line-height:1.3;min-width:0}.who b{flex:none;display:flex;align-items:center;gap:6px}.who .cm{font-size:13px}
.vf{width:16px;height:16px}.dots{font-size:22px;color:var(--mute);padding:4px 8px;line-height:1}
.pt{margin:6px 16px 10px}.post .img{aspect-ratio:4/3;border-radius:14px;margin:0 16px;width:calc(100% - 32px)}
.acts{padding:12px 16px 6px;gap:22px}.acts button{display:flex;align-items:center;gap:7px;color:var(--mute)}.acts button.liked{color:var(--heart)}
.acts button.saved{color:var(--accent)}.acts .saved .ic{fill:var(--accent)}.meta{padding:0 16px 14px}
.comp input[type=text]{flex:1;min-width:0;margin:0;background:var(--bg);border-radius:14px}
.ci{width:40px;height:40px;border-radius:12px;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);display:grid;place-items:center;flex:none}
.ci.on{background:var(--accent);color:#fff}
.cpost{background:linear-gradient(45deg,#d62976,#962fbf);color:#fff;border-radius:12px;padding:10px 14px;font-weight:700;flex:none}
.cprev{position:relative;aspect-ratio:16/9;background-size:cover;background-position:center;border-radius:14px;margin-top:12px}
.cprev button{position:absolute;top:8px;right:8px;background:#000a;color:#fff;border-radius:50%;width:28px;height:28px}
.cpoll{display:grid;gap:8px;margin-top:12px}.cpoll input{margin:0!important}
.emos{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.emos button{font-size:22px;padding:4px 6px;border-radius:8px}
.poll{margin:0 16px 12px;display:grid;gap:8px}
.po{position:relative;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;overflow:hidden;text-align:left;width:100%}
.po i{position:absolute;inset:0 auto 0 0;background:color-mix(in srgb,var(--accent) 25%,transparent)}.po.mine{border-color:var(--accent)}.po span,.po b{position:relative}
.pill{margin-left:auto;background:color-mix(in srgb,var(--accent) 35%,transparent);color:var(--ink);font:700 12px/1 sans-serif;padding:5px 8px;border-radius:8px;font-style:normal}
.srow{display:flex;gap:16px;align-items:center;margin-bottom:12px}
.ucard{margin-top:auto;display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:10px}
.uc{display:flex;align-items:center;gap:10px;flex:1;text-align:left;min-width:0}
.sh2{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.sh2 h3{margin:0;font-size:16px}
.fbtn{background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--ink);border-radius:10px;padding:7px 16px;font-weight:600;font-size:13px}
.tr{display:block;width:100%;text-align:left;padding:10px 0}
#sug .box{margin:0 0 14px}
.sx{display:none;margin-left:auto}
@media (max-width:899px){#side.open{display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:290px;background:var(--card);padding:calc(env(safe-area-inset-top,0px) + 16px) 12px 16px;z-index:25;box-shadow:0 0 0 100vmax #0008;overflow:auto}#side.open .sx{display:block}}
@media (min-width:900px){
#side.on{left:16px;top:16px;bottom:16px;width:260px;border:1px solid var(--line);border-radius:22px;padding:20px 12px 12px;background:var(--card)}
#side.on+#app{max-width:560px;margin-left:calc(292px + (100% - 292px - 560px)/2)}
.sb.on{background:color-mix(in srgb,var(--accent) 22%,transparent)}}
@media (min-width:1200px) and (max-width:1299px){#sug.on{display:none}}
@media (min-width:1300px){#sug.on{display:block;top:16px;width:320px;left:calc(292px + (100vw - 292px - 352px - 560px)/2 + 576px);max-height:calc(100vh - 32px);overflow:auto}}

/* ===== glass ===== */
:root:not([data-theme="light"]){--g1:rgba(255,255,255,.15);--g2:rgba(255,255,255,.04);--gb:rgba(255,255,255,.22);--gf:rgba(255,255,255,.07);--sheen:rgba(255,255,255,.2);--gsh:0 12px 44px rgba(0,0,0,.5),0 0 34px rgba(214,41,118,.2),0 0 50px rgba(98,75,255,.16)}
:root[data-theme="light"]{--g1:rgba(255,255,255,.82);--g2:rgba(255,255,255,.5);--gb:rgba(255,255,255,.95);--gf:rgba(255,255,255,.65);--sheen:rgba(255,255,255,.9);--gsh:0 12px 36px rgba(124,80,210,.22)}
body::before{content:"";position:fixed;inset:-10%;z-index:-1;pointer-events:none;background:radial-gradient(380px 380px at 12% 20%,rgba(255,46,147,.55),transparent 70%),radial-gradient(480px 480px at 88% 10%,rgba(109,75,255,.5),transparent 70%),radial-gradient(460px 460px at 75% 92%,rgba(214,41,118,.45),transparent 70%),radial-gradient(420px 420px at 15% 88%,rgba(47,107,255,.5),transparent 70%);animation:drift 24s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(3%,-2%,0) scale(1.1)}}
:root[data-theme="light"] body::before{opacity:.5}
.post,.box,.stories,.auth .box,#side.on,#side.open,.ucard,.dlg,#nb,header,nav{background:radial-gradient(120% 90% at 0 0,var(--sheen),transparent 55%),linear-gradient(135deg,var(--g1),var(--g2) 50%,var(--g1));-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);border:1px solid var(--gb);box-shadow:inset 0 1px 0 var(--sheen),inset 7px 0 14px -8px rgba(255,120,230,.55),inset -7px 0 14px -8px rgba(110,150,255,.55),var(--gsh)}
.post,.box,.stories,.auth .box{border-radius:24px}
header{border-radius:0 0 22px 22px;border-top:0}
nav{border-radius:22px 22px 0 0;border-bottom:0}
#side.open{box-shadow:inset 0 1px 0 var(--sheen),var(--gsh),0 0 0 100vmax rgba(0,0,0,.55)}
.post,.box,.dlg{position:relative}
.post::before,.box::before,.dlg::before,#side.on::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;background:linear-gradient(135deg,#ff5fd0,rgba(255,255,255,.12) 30%,#7c5cff 62%,#46b0ff);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);mask-composite:exclude;pointer-events:none;opacity:.9}
#app input[type=text],#app input[type=email],#app input[type=password],#app textarea,#sug input{background:var(--gf);border:1px solid var(--gb);color:var(--ink)}
.chip,.po,.ci,.fbtn{background:var(--gf);border:1px solid var(--gb);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.chip.on,.ci.on{background:linear-gradient(135deg,#ff4fa3,#8b5cff);border-color:transparent;color:#fff}
.btn,.cpost{background:linear-gradient(135deg,#ff4fa3,#8b5cff 55%,#3d8bff);color:#fff;border:0;box-shadow:0 0 22px rgba(168,85,247,.55),inset 0 1px 0 rgba(255,255,255,.4)}
.btn:disabled{opacity:.4;box-shadow:none}
.sb.on{background:linear-gradient(135deg,rgba(255,79,163,.3),rgba(124,92,255,.3));box-shadow:inset 0 0 0 1px rgba(255,255,255,.28),0 0 20px rgba(168,85,247,.5)}
.sb:hover{background:rgba(255,255,255,.08)}
.post .img{box-shadow:0 0 0 1px rgba(255,255,255,.28),0 14px 34px rgba(0,0,0,.45)}
.ph .av{box-shadow:0 0 0 2px rgba(255,255,255,.25),0 0 0 4px var(--accent),0 0 16px var(--accent)}
#cfm{background:rgba(6,2,16,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.dl{border-top:1px solid var(--gb)}
#toast{background:rgba(30,16,60,.72);color:#fff;border:1px solid var(--gb);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
@media (hover:hover){.post{transition:transform .35s ease,box-shadow .35s ease}.post:hover{transform:perspective(1100px) rotateX(1deg) rotateY(-1.4deg) translateY(-2px)}}
@media (prefers-reduced-motion:reduce){body::before{animation:none}.post:hover{transform:none}}
.lgo .face{background:none}
.brand{position:relative;display:inline-block;vertical-align:middle}
.bmark{position:absolute;left:50%;top:50%;width:0;height:0;display:flex;align-items:center;justify-content:center;opacity:.42;pointer-events:none}
.brand .logo{position:relative;display:inline-block;white-space:nowrap;filter:drop-shadow(0 2px 5px rgba(0,0,0,.65))}
.sl{padding:26px 6px 30px}
.bgm{position:absolute;left:50%;top:50%;width:var(--w);height:var(--w);transform:translate(-50%,-50%);opacity:.6;pointer-events:none;overflow:visible;animation:sway2 6s ease-in-out infinite alternate}
@keyframes sway2{from{transform:translate(-50%,-50%) perspective(260px) rotateY(-22deg) rotateX(8deg)}to{transform:translate(-50%,-50%) perspective(260px) rotateY(22deg) rotateX(-6deg)}}
@media (prefers-reduced-motion:reduce){.bgm{animation:none;transform:translate(-50%,-50%) perspective(260px) rotateY(-14deg) rotateX(6deg)}}
.brand .logo{font-size:inherit}

:root[data-theme="light"]{--tint:rgba(255,255,255,0)}
